<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FBAD18" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBAD18" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="300" fill="#FBAD18" opacity="0.08" filter="blur(60px)" />
  <circle cx="1050" cy="480" r="280" fill="#3B82F6" opacity="0.07" filter="blur(70px)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 75)">
    <rect width="210" height="38" rx="19" fill="#1E293B" stroke="#FBAD18" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="22" cy="19" r="6" fill="#FBAD18" />
    <text x="36" y="24" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">BM4U GUIDE • SCALING</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="175" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Facebook BM2500 Guide
  </text>
  <text x="100" y="235" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
    Scale Spend Limit Without Bans
  </text>
  <text x="100" y="290" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" width="550">
    How media buyers unlock $2,500/day limit instantly &amp; prevent review checkpoints.
  </text>

  <!-- Tags Pill Row -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="125" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#BM2500</text>

    <rect x="135" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="150" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#MetaAds</text>

    <rect x="275" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="290" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#HighLimit</text>

    <rect x="430" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="445" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#MediaBuying</text>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(720, 110)" filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect width="380" height="420" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="380" height="60" rx="24" fill="#0F172A" />
    <path d="M0 40 h380 v20 h-380 z" fill="#0F172A" />
    <circle cx="35" cy="30" r="12" fill="#FBAD18" opacity="0.2" />
    <text x="30" y="35" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="15" font-weight="800">M</text>
    <text x="58" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Meta Business Suite</text>
    <rect x="280" y="20" width="75" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="295" y="35" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ACTIVE</text>

    <!-- Spending Limit Stat Box -->
    <g transform="translate(30, 85)">
      <rect width="320" height="95" rx="16" fill="#0B0F19" stroke="#FBAD18" stroke-width="1.5" stroke-opacity="0.6" />
      <text x="20" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">DAILY SPENDING LIMIT</text>
      <text x="20" y="70" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="34" font-weight="900">$2,500.00</text>
      <text x="200" y="70" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">/ Day (Tier 1)</text>
    </g>

    <!-- Checklist items inside Card -->
    <g transform="translate(30, 205)">
      <!-- Item 1 -->
      <circle cx="14" cy="14" r="12" fill="#FBAD18" fill-opacity="0.15" />
      <path d="M10 14 l3 3 l6 -6" stroke="#FBAD18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="19" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Zero Spending Delay Bottleneck</text>

      <!-- Item 2 -->
      <circle cx="14" cy="54" r="12" fill="#FBAD18" fill-opacity="0.15" />
      <path d="M10 54 l3 3 l6 -6" stroke="#FBAD18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="59" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Reinstated Admin Cookie Bind</text>

      <!-- Item 3 -->
      <circle cx="14" cy="94" r="12" fill="#FBAD18" fill-opacity="0.15" />
      <path d="M10 94 l3 3 l6 -6" stroke="#FBAD18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="99" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Automated Risk Filter Bypass</text>

      <!-- Item 4 -->
      <circle cx="14" cy="134" r="12" fill="#FBAD18" fill-opacity="0.15" />
      <path d="M10 134 l3 3 l6 -6" stroke="#FBAD18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="139" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Backup Admin Protection</text>
    </g>

    <!-- Card Bottom Badge -->
    <rect x="30" y="365" width="320" height="34" rx="8" fill="#FBAD18" fill-opacity="0.12" stroke="#FBAD18" stroke-opacity="0.3" stroke-width="1" />
    <text x="75" y="387" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Verified &amp; Tested on Meta 2026</text>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(100, 560)">
    <rect width="180" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" fill="#FDE047" font-family="system-ui, sans-serif" font-size="13" font-weight="800">BM4U.NET</text>
    <text x="90" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• OFFICIAL GUIDE</text>
  </g>
</svg>
