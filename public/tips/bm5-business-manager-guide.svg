<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#10192E" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FBAD18" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.96" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)" />
  <circle cx="200" cy="200" r="280" fill="#6366F1" opacity="0.08" filter="blur(70px)" />
  <circle cx="1000" cy="400" r="280" fill="#FBAD18" opacity="0.09" filter="blur(70px)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 75)">
    <rect width="240" height="38" rx="19" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="22" cy="19" r="6" fill="#6366F1" />
    <text x="36" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AGENCY ARCHITECTURE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="175" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    What is BM5 Business Manager?
  </text>
  <text x="100" y="235" fill="url(#goldGrad3)" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Multi-Ad Account Risk Isolation
  </text>
  <text x="100" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18" font-weight="400">
    How professional agencies manage 5 ad accounts, share pixels &amp; stop cascade bans.
  </text>

  <!-- Tags Pill Row -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#BM5-Guide</text>

    <rect x="115" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="130" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#RiskIsolation</text>

    <rect x="270" y="0" width="135" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="285" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#PixelSharing</text>

    <rect x="415" y="0" width="135" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="430" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#MetaStrategy</text>
  </g>

  <!-- Right Visual 5-Node Architecture Card -->
  <g transform="translate(720, 110)" filter="url(#shadow3)">
    <rect width="380" height="420" rx="24" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="380" height="60" rx="24" fill="#0F172A" />
    <path d="M0 40 h380 v20 h-380 z" fill="#0F172A" />
    <circle cx="35" cy="30" r="14" fill="#6366F1" opacity="0.2" />
    <text x="30" y="36" fill="#6366F1" font-family="system-ui, sans-serif" font-size="15" font-weight="800">5</text>
    <text x="58" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">BM5 Multi-Account Hub</text>
    <rect x="270" y="20" width="85" height="22" rx="11" fill="#FBAD18" fill-opacity="0.2" stroke="#FBAD18" stroke-width="1" />
    <text x="280" y="35" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="11" font-weight="700">5/5 READY</text>

    <!-- 5 Ad Accounts Visual Representation -->
    <g transform="translate(25, 75)">
      <!-- Account 1 -->
      <rect x="0" y="0" width="330" height="46" rx="10" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
      <circle cx="20" cy="23" r="8" fill="#10B981" />
      <text x="38" y="28" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ad Account #1 • E-commerce Scale</text>
      <text x="270" y="28" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$250/d</text>

      <!-- Account 2 -->
      <rect x="0" y="54" width="330" height="46" rx="10" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
      <circle cx="20" cy="77" r="8" fill="#10B981" />
      <text x="38" y="82" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ad Account #2 • Lead Generation</text>
      <text x="270" y="82" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$250/d</text>

      <!-- Account 3 -->
      <rect x="0" y="108" width="330" height="46" rx="10" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
      <circle cx="20" cy="131" r="8" fill="#10B981" />
      <text x="38" y="136" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ad Account #3 • Retargeting Funnel</text>
      <text x="270" y="136" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$250/d</text>

      <!-- Account 4 -->
      <rect x="0" y="162" width="330" height="46" rx="10" fill="#0B0F19" stroke="#10B981" stroke-width="1" />
      <circle cx="20" cy="185" r="8" fill="#10B981" />
      <text x="38" y="190" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ad Account #4 • Testing Sandbox</text>
      <text x="270" y="190" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$250/d</text>

      <!-- Account 5 -->
      <rect x="0" y="216" width="330" height="46" rx="10" fill="#0B0F19" stroke="#FBAD18" stroke-width="1.5" />
      <circle cx="20" cy="239" r="8" fill="#FBAD18" />
      <text x="38" y="244" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Ad Account #5 • Main Pixel Host</text>
      <text x="270" y="244" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="11" font-weight="700">HOLD</text>
    </g>

    <!-- Card Bottom Note -->
    <rect x="25" y="355" width="330" height="42" rx="10" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1" />
    <text x="45" y="380" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="12" font-weight="600">If 1 Account Pauses, 4 Remain 100% Active</text>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(100, 560)">
    <rect width="180" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" fill="#FDE047" font-family="system-ui, sans-serif" font-size="13" font-weight="800">BM4U.NET</text>
    <text x="90" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• ARCHITECTURE</text>
  </g>
</svg>
