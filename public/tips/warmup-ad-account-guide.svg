<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="50%" stop-color="#111B2C" />
      <stop offset="100%" stop-color="#0E1624" />
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FBAD18" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)" />
  <circle cx="220" cy="180" r="280" fill="#F59E0B" opacity="0.08" filter="blur(70px)" />
  <circle cx="980" cy="420" r="280" fill="#10B981" opacity="0.08" filter="blur(70px)" />

  <g stroke="#334155" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 75)">
    <rect width="210" height="38" rx="19" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="22" cy="19" r="6" fill="#F59E0B" />
    <text x="36" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CAMPAIGN BLUEPRINT</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="175" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    How to Warm Up Ad Accounts
  </text>
  <text x="100" y="235" fill="url(#goldGrad5)" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    7-Day Trust Escalation Guide
  </text>
  <text x="100" y="290" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="18" font-weight="400">
    Proven methodology to unlock card billing thresholds without triggering unusual activity flags.
  </text>

  <!-- Tags Pill Row -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#WarmupGuide</text>

    <rect x="140" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="154" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#MetaSecurity</text>

    <rect x="280" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="295" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#BillingThreshold</text>

    <rect x="435" y="0" width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="450" y="20" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">#ScaleAdsFast</text>
  </g>

  <!-- Right Visual 7-Day Warmup Card -->
  <g transform="translate(720, 110)" filter="url(#shadow5)">
    <rect width="380" height="420" rx="24" fill="url(#cardGrad5)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <rect width="380" height="60" rx="24" fill="#0F172A" />
    <path d="M0 40 h380 v20 h-380 z" fill="#0F172A" />
    <circle cx="35" cy="30" r="14" fill="#10B981" opacity="0.2" />
    <path d="M30 30 L34 34 L40 26" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="58" y="35" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">7-Day Warmup Timeline</text>
    <rect x="270" y="20" width="85" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="283" y="35" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VERIFIED</text>

    <!-- Warmup Stages -->
    <g transform="translate(25, 75)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="330" height="58" rx="12" fill="#0B0F19" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="29" r="12" fill="#3B82F6" fill-opacity="0.2" />
      <text x="20" y="34" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="12" font-weight="800">D1</text>
      <text x="48" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Day 1: Page Like / Engagement Ad</text>
      <text x="48" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Budget: $5 - $10/day • Clean creative</text>

      <!-- Stage 2 -->
      <rect x="0" y="66" width="330" height="58" rx="12" fill="#0B0F19" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="95" r="12" fill="#F59E0B" fill-opacity="0.2" />
      <text x="17" y="100" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="12" font-weight="800">D3</text>
      <text x="48" y="92" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Day 2-3: First Billing Charge Trigger</text>
      <text x="48" y="110" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Pay small bill ($2-$5) • Builds card trust</text>

      <!-- Stage 3 -->
      <rect x="0" y="132" width="330" height="58" rx="12" fill="#0B0F19" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="161" r="12" fill="#10B981" fill-opacity="0.2" />
      <text x="17" y="166" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="800">D5</text>
      <text x="48" y="158" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Day 4-5: Traffic &amp; Conversion Testing</text>
      <text x="48" y="176" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Increase spend to $50 - $100/day</text>

      <!-- Stage 4 -->
      <rect x="0" y="198" width="330" height="58" rx="12" fill="#0B0F19" stroke="#FBAD18" stroke-width="1.5" />
      <circle cx="24" cy="227" r="12" fill="#FBAD18" fill-opacity="0.2" />
      <text x="17" y="232" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="12" font-weight="800">D7</text>
      <text x="48" y="224" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Day 6-7: Full Scale Mode</text>
      <text x="48" y="242" fill="#FBAD18" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Unlock $250 - $2,500/day headroom</text>
    </g>

    <rect x="25" y="355" width="330" height="42" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="45" y="380" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Over 99.4% Survival Rate with This Warmup</text>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(100, 560)">
    <rect width="180" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" fill="#FDE047" font-family="system-ui, sans-serif" font-size="13" font-weight="800">BM4U.NET</text>
    <text x="90" y="21" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• WARMUP PLAYBOOK</text>
  </g>
</svg>
